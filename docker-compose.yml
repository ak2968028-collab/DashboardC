x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-varanasi}
  POSTGRES_USER: ${POSTGRES_USER:-varanasi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varanasi}

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml --url http://fast_backend:8000
    configs:
      - source: cloudflared
        target: /etc/cloudflared/config.yml
    depends_on:
      - fast_backend
      - geoserver
    restart: unless-stopped

  fast_backend:
    build:
      context: ./fast_backend
    image: varanasi-carbon-fast-backend
    environment:
      <<: *postgres-env
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      # Used by fast_backend/start.sh to publish layers & rasters.
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USERNAME: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
    volumes:
      # Code mounted like SLCR, so migrations generated by start.sh land in the project.
      - ./fast_backend:/home/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  database:
    image: postgis/postgis:17-3.5-alpine
    environment:
      <<: *postgres-env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - varanasi_pgdata:/var/lib/postgresql/data
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/zz-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ./frontend
  #     # Next.js bakes its /api and /geoserver rewrites in at build time.
  #     # The browser only ever calls the public domain (relative URLs); the
  #     # Next.js server forwards those requests to these internal addresses.
  #     args:
  #       API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #       GEOSERVER_URL: ${FRONTEND_GEOSERVER_URL:-http://geoserver:8080}
  #   image: varanasi-carbon-frontend
  #   environment:
  #     API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #     GEOSERVER_URL: ${FRONTEND_GEOSERVER_URL:-http://geoserver:8080}
  #   ports:
  #     - "${WEB_PORT:-3000}:3000"
  #   depends_on:
  #     fast_backend:
  #       condition: service_healthy
  #   restart: unless-stopped

  geoserver:
    image: kartoza/geoserver:3.0.0
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      # Kartoza ships CORS on and demo data off by default.
      SAMPLE_DATA: "false"
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - varanasi_geoserver:/opt/geoserver/data_dir
    depends_on:
      database:
        condition: service_healthy
    # Kartoza's image has no built-in healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/geoserver/web/ -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Writes every service's output to ./logs/<service>.log and ./logs/all.log
  # (rotated at 10 MB, 5 old copies kept). See logs/collect-logs.sh.
  log_collector:
    image: docker:27-cli
    entrypoint: ["sh", "/logs/collect-logs.sh"]
    environment:
      LOG_SERVICES: fast_backend database geoserver cloudflared
      LOG_MAX_BYTES: 10485760
      LOG_KEEP: 5
      # Host user that should own the log files.
      LOG_OWNER: ${LOG_OWNER:-1000:1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs
    restart: unless-stopped

configs:
  cloudflared:
    content: |
      ingress:
        - path: ^/geoserver(/.*)?$$
          service: http://geoserver:8080
        - service: http://fast_backend:8000

volumes:
  varanasi_pgdata:
  varanasi_geoserver:
