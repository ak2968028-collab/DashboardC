x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-varanasi}
  POSTGRES_USER: ${POSTGRES_USER:-varanasi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varanasi}

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    # Named tunnel "carbondashboard". Routes (public hostname -> service) are
    # managed in the Cloudflare dashboard; the token lives in ./.env.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - fast_backend
      - geoserver
    restart: unless-stopped

  fast_backend:
    build:
      context: ./fast_backend
    image: varanasi-carbon-fast-backend
    environment:
      <<: *postgres-env
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      # Used by fast_backend/start.sh to publish layers & rasters.
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USERNAME: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      # AI assistant: Ollama on the HP GPU PC, through the "ollama" service's tunnel.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11435}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Code mounted like SLCR, so migrations generated by start.sh land in the project.
      - ./fast_backend:/home/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      # Started first but not waited on: the dashboard works (assistant offline) when the GPU PC is off.
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  database:
    image: postgis/postgis:17-3.5-alpine
    environment:
      <<: *postgres-env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - varanasi_pgdata:/var/lib/postgresql/data
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/zz-init-databases.sql:ro
    healthcheck:
      # Over TCP: during first-time initialisation Postgres only listens on its Unix socket and then restarts,
      # so a socket check reports healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ./frontend
  #     # Next.js bakes its /api and /geoserver rewrites in at build time.
  #     # The browser only ever calls the public domain (relative URLs); the
  #     # Next.js server forwards those requests to these internal addresses.
  #     args:
  #       API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #       GEOSERVER_URL: ${FRONTEND_GEOSERVER_URL:-http://geoserver:8080}
  #   image: varanasi-carbon-frontend
  #   environment:
  #     API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #     GEOSERVER_URL: ${FRONTEND_GEOSERVER_URL:-http://geoserver:8080}
  #   ports:
  #     - "${WEB_PORT:-3000}:3000"
  #   depends_on:
  #     fast_backend:
  #       condition: service_healthy
  #   restart: unless-stopped

  geoserver:
    image: kartoza/geoserver:3.0.0
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      # Kartoza ships CORS on and demo data off by default.
      SAMPLE_DATA: "false"
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - varanasi_geoserver:/opt/geoserver/data_dir
    depends_on:
      database:
        condition: service_healthy
    # Kartoza's image has no built-in healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/geoserver/web/ -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # AI assistant model server. Ollama (qwen2.5:7b chat + nomic-embed-text embeddings) runs on the HP GPU PC
  # (RTX 2000 Ada) as a Windows startup task; this service keeps the SSH tunnel to it open, so fast_backend reaches
  # it at host.docker.internal:11435 (OLLAMA_URL). Needs the public key of OLLAMA_SSH_KEY installed on that PC.
  ollama:
    image: alpine:3.20
    # Host network: the GPU PC's reverse tunnel listens on this host's 127.0.0.1:2222.
    network_mode: host
    entrypoint: ["sh", "/ollama/tunnel.sh"]
    environment:
      SSH_TARGET: ${OLLAMA_SSH_TARGET:-hp@localhost}
      SSH_PORT: ${OLLAMA_SSH_PORT:-2222}
      # Docker bridge address: reachable from the containers, not from the LAN.
      LISTEN: ${OLLAMA_TUNNEL_LISTEN:-172.17.0.1:11435}
      MODELS: ${OLLAMA_MODEL:-qwen2.5:7b} ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./ollama/tunnel.sh:/ollama/tunnel.sh:ro
      - ${OLLAMA_SSH_KEY:-${HOME}/.ssh/ollama_hp_ed25519}:/run/secrets/ollama_key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://$${LISTEN}/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Writes every service's output to ./logs/<service>.log and ./logs/all.log
  # (rotated at 10 MB, 5 old copies kept). See logs/collect-logs.sh.
  log_collector:
    image: docker:27-cli
    entrypoint: ["sh", "/logs/collect-logs.sh"]
    environment:
      LOG_SERVICES: fast_backend database geoserver cloudflared ollama
      LOG_MAX_BYTES: 10485760
      LOG_KEEP: 5
      # Host user that should own the log files.
      LOG_OWNER: ${LOG_OWNER:-1000:1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs
    restart: unless-stopped

volumes:
  varanasi_pgdata:
  varanasi_geoserver:
