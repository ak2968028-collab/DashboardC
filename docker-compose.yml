x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-varanasi}
  POSTGRES_USER: ${POSTGRES_USER:-varanasi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varanasi}

services:
  fast_backend:
    build:
      context: ./fast_backend
    image: varanasi-carbon-fast-backend
    environment:
      <<: *postgres-env
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      # Used by fast_backend/start.sh to publish layers & rasters.
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USERNAME: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
    volumes:
      # Code mounted like SLCR, so migrations generated by start.sh land in the project.
      - ./fast_backend:/home/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  database:
    image: postgis/postgis:17-3.5-alpine
    environment:
      <<: *postgres-env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - varanasi_pgdata:/var/lib/postgresql/data
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/zz-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ./frontend
  #     # Next.js bakes its /api and /geoserver rewrites in at build time.
  #     # The browser only ever calls the public domain (relative URLs); the
  #     # Next.js server forwards those requests to these internal addresses.
  #     args:
  #       API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #       GEOSERVER_URL: ${FRONTEND_GEOSERVER_URL:-http://geoserver:8080}
  #   image: varanasi-carbon-frontend
  #   environment:
  #     API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #     GEOSERVER_URL: ${FRONTEND_GEOSERVER_URL:-http://geoserver:8080}
  #   ports:
  #     - "${WEB_PORT:-3000}:3000"
  #   depends_on:
  #     fast_backend:
  #       condition: service_healthy
  #   restart: unless-stopped

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.5
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      # So GetCapabilities and the admin UI generate links on the public domain.
      PROXY_BASE_URL: https://${PUBLIC_DOMAIN:-localhost}/geoserver
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - varanasi_geoserver:/opt/geoserver_data
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # The frontend runs on Vercel; its Next.js server proxies /api/* and
  # /geoserver/* to API_URL and GEOSERVER_URL (set in Vercel). These quick
  # tunnels expose the backend and GeoServer on this machine for that.
  # Opt-in: `docker compose --profile tunnel up`. No account or token needed;
  # Cloudflare assigns a new random https://<name>.trycloudflare.com URL on
  # each start, printed in `docker compose logs cloudflared-api cloudflared-geoserver`.
  cloudflared-api:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://fast_backend:8000
    depends_on:
      - fast_backend
    restart: unless-stopped

  cloudflared-geoserver:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://geoserver:8080
    depends_on:
      - geoserver
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    # Opt-in: `docker compose --profile named-tunnel up`. Remotely-managed
    # tunnel with fixed hostnames on your own domain; in the Cloudflare Zero
    # Trust dashboard add public hostnames -> http://fast_backend:8000 and
    # http://geoserver:8080.
    profiles: ["named-tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - fast_backend
      - geoserver
    restart: unless-stopped

volumes:
  varanasi_pgdata:
  varanasi_geoserver:
